// ═══ AUDIO ENGINE (Mario Kart style) ═══
let audioCtx = null;
let audioReady = false;

// Unlock audio on the FIRST user gesture anywhere on the page
// iOS requires: create context + resume + play something, all inside a gesture
// Sounds won't work until audioReady=true (after resume() promise resolves)
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Play a silent oscillator synchronously (helps some iOS versions)
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(0);
    osc.stop(audioCtx.currentTime + 0.001);
    // Resume and mark ready when done
    audioCtx.resume().then(function() {
      audioReady = true;
    }).catch(function(){});
    // Fallback: if resume doesn't fire .then on some browsers, poll
    setTimeout(function() {
      if (audioCtx && audioCtx.state === 'running') audioReady = true;
    }, 100);
    setTimeout(function() {
      if (audioCtx && audioCtx.state === 'running') audioReady = true;
    }, 300);
  } catch(e) {}
}

// Attach unlock to both touch and click on the whole document
// so ANY tap on the page unlocks audio, even before hitting a game button
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('mousedown', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

// Alias so existing event handlers still work
function resumeAudio() { initAudio(); }

function playTone(freq, duration, type = 'square', vol = 0.15, slide = 0) {
  if (!audioReady) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playNoise(duration, vol = 0.08) {
  if (!audioReady) return;
  try {
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800;
    src.buffer = buffer;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ═══ DRAWING HELPERS ═══
function roundRect(x,y,w,h,r,fill,stroke,lw) {
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function drawSky() {
  const g=ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0,COLORS.skyTop);g.addColorStop(1,COLORS.sky);
  ctx.fillStyle=g;ctx.fillRect(0,0,900,GROUND_Y);
}
function drawClouds() {
  ctx.fillStyle='rgba(255,255,255,0.85)';
  cloudOffsets.forEach(c=>{
    let cx=(c.x-cameraX*0.15+frameCount*c.speed)%1200-150;
    ctx.beginPath();
    ctx.arc(cx,c.y,c.size*0.5,0,Math.PI*2);
    ctx.arc(cx+c.size*0.4,c.y-c.size*0.2,c.size*0.4,0,Math.PI*2);
    ctx.arc(cx+c.size*0.8,c.y,c.size*0.45,0,Math.PI*2);
    ctx.fill();
  });
}
function drawGround() {
  const g=ctx.createLinearGradient(0,GROUND_Y,0,600);
  g.addColorStop(0,COLORS.grass);g.addColorStop(1,COLORS.grassDark);
  ctx.fillStyle=g;ctx.fillRect(0,GROUND_Y,900,160);
  ctx.fillStyle=COLORS.road;ctx.fillRect(0,GROUND_Y-5,900,30);
  ctx.strokeStyle='#000';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y-5);ctx.lineTo(900,GROUND_Y-5);
  ctx.moveTo(0,GROUND_Y+25);ctx.lineTo(900,GROUND_Y+25);ctx.stroke();
  ctx.strokeStyle=COLORS.roadLine;ctx.lineWidth=3;ctx.setLineDash([20,15]);
  ctx.beginPath();ctx.moveTo(0,GROUND_Y+10);ctx.lineTo(900,GROUND_Y+10);ctx.stroke();
  ctx.setLineDash([]);
  ctx.save();ctx.fillStyle='#FFF';ctx.font='bold 11px Arial';ctx.globalAlpha=0.5;
  for(let i=0;i<50;i++){let rx=(i*300-cameraX%300+300)%(300*50)-300;
    if(rx>-50&&rx<950)ctx.fillText('A34',rx+20,GROUND_Y+18);}
  ctx.restore();
}

function drawLandmarks() {
  ctx.font='bold 14px "Bubblegum Sans",cursive';
  landmarks.forEach(lm=>{
    let lx=lm.dist*MILE_TO_PX-cameraX;
    if(lx>-120&&lx<1020){
      // Bigger sign post
      ctx.fillStyle='#8B4513';ctx.fillRect(lx+10,GROUND_Y-90,7,90);
      ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(lx+10,GROUND_Y-90,7,90);
      // Bigger sign
      ctx.font='bold 14px "Bubblegum Sans",cursive';
      let tw=ctx.measureText(lm.name).width;
      let signW=Math.max(tw+36,90);
      roundRect(lx+13-signW/2,GROUND_Y-126,signW,42,6,'#006400','#FFF',2);
      ctx.fillStyle='#FFF';ctx.textAlign='center';
      ctx.font='bold 15px "Bubblegum Sans",cursive';
      ctx.fillText(lm.name,lx+13,GROUND_Y-104);
      ctx.font='13px "Bubblegum Sans",cursive';
      ctx.fillText(lm.dist+' mi',lx+13,GROUND_Y-88);
      ctx.textAlign='left';
      ctx.font='28px serif';ctx.fillText(lm.icon,lx-2,GROUND_Y-130);
      // Mini buildings
      if(lm.dist>0){const r=mulberry32(lm.dist*1337);const n=2+Math.floor(r()*3);
        for(let i=0;i<n;i++){let bx=lx-30+i*25+r()*10,bh=20+r()*30,bw=15+r()*10;
          let cols=['#E8D44D','#FF6B6B','#87CEEB','#DDA0DD','#98FB98'];
          ctx.fillStyle=cols[Math.floor(r()*cols.length)];
          ctx.fillRect(bx,GROUND_Y-bh-30,bw,bh);
          ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(bx,GROUND_Y-bh-30,bw,bh);
          ctx.fillStyle='#8B0000';ctx.beginPath();
          ctx.moveTo(bx-3,GROUND_Y-bh-30);ctx.lineTo(bx+bw/2,GROUND_Y-bh-42);
          ctx.lineTo(bx+bw+3,GROUND_Y-bh-30);ctx.closePath();ctx.fill();ctx.stroke();}}
    }
  });
}

// ═══ PROGRESS TRACKER HUD ═══
function drawProgressTracker() {
  let miles = Math.max(0,(snailX-120)/MILE_TO_PX);
  let barX=50, barY=15, barW=800, barH=12;

  // Background bar
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,6);ctx.stroke();

  // Filled portion
  let fill = Math.min(1, miles/162);
  if(fill>0){
    let grad=ctx.createLinearGradient(barX,0,barX+barW*fill,0);
    grad.addColorStop(0,'#4CAF50');grad.addColorStop(0.5,'#FFD700');grad.addColorStop(1,'#FF6B00');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(barX,barY,barW*fill,barH,6);ctx.fill();
  }

  // Landmark dots
  landmarks.forEach(lm=>{
    let dx=barX+(lm.dist/162)*barW;
    let passed=miles>=lm.dist;
    ctx.fillStyle=passed?'#FFD700':'rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(dx,barY+barH/2,passed?4:2.5,0,Math.PI*2);ctx.fill();
    // Show name for key landmarks
    if([0,32,78,118,145,162].includes(lm.dist)){
      ctx.fillStyle=passed?'#FFD700':'rgba(255,255,255,0.6)';
      ctx.font='9px "Bubblegum Sans",cursive';ctx.textAlign='center';
      ctx.fillText(lm.name,dx,barY+barH+11);ctx.textAlign='left';
    }
  });

  // Snail position marker
  let snailDotX=barX+fill*barW;
  ctx.fillStyle='#FF3333';
  ctx.beginPath();ctx.arc(snailDotX,barY+barH/2,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFF';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(snailDotX,barY+barH/2,5,0,Math.PI*2);ctx.stroke();

  // Distance text
  roundRect(370,32,160,28,6,'rgba(0,0,0,0.6)','#FFD700',1.5);
  ctx.fillStyle='#FFD700';ctx.font='bold 18px "Bubblegum Sans",cursive';ctx.textAlign='center';
  ctx.fillText(miles.toFixed(1)+' / 162 miles',450,53);ctx.textAlign='left';
}

// ═══ WIND METER ═══
function drawWindMeter() {
  // Smooth interpolation
  windMeterValue += (windMeterTarget - windMeterValue) * 0.1;

  let mx=770, my=75, mw=110, mh=40;
  roundRect(mx,my,mw,mh,8,'rgba(0,0,0,0.7)','rgba(255,255,255,0.3)',1);

  // Label
  ctx.fillStyle='#FFF';ctx.font='bold 11px "Bubblegum Sans",cursive';ctx.textAlign='center';
  ctx.fillText('WIND',mx+mw/2,my+13);

  // Meter bar
  let barX=mx+10, barY=my+18, barW=mw-20, barH=8;
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,4);ctx.fill();

  // Center line
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillRect(barX+barW/2-1,barY-2,2,barH+4);

  // Wind indicator
  let center=barX+barW/2;
  let offset=windMeterValue*(barW/2)*0.8;
  let indicatorX=center+offset;
  let color=windMeterValue>0.1?'#98FB98':windMeterValue<-0.1?'#FF6B6B':'#FFF';
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(indicatorX,barY+barH/2,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFF';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(indicatorX,barY+barH/2,5,0,Math.PI*2);ctx.stroke();

  // Label below
  let windText=windMeterValue>0.3?'TAILWIND':windMeterValue<-0.3?'HEADWIND':'CALM';
  ctx.fillStyle=color;ctx.font='bold 9px "Bubblegum Sans",cursive';
  ctx.fillText(windText,mx+mw/2,my+mh-2);
  ctx.textAlign='left';
}

// ═══ WIND VISUAL EFFECTS ═══
function drawWindEffects() {
  if(!activeWindGust) { windMeterTarget=0; currentWindLabel=''; return; }
  windArrowTimer++;
  windMeterTarget=Math.max(-1,Math.min(1,activeWindGust.forceX/3));

  // Wind streaks across the whole screen
  let isGood=activeWindGust.forceX>0;
  let col=isGood?'rgba(152,251,152,':'rgba(255,107,107,';
  ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    let wx=(Math.random()*1000);
    let wy=80+Math.random()*320;
    let len=activeWindGust.forceX*20;
    let alpha=0.15+Math.random()*0.25;
    ctx.strokeStyle=col+alpha+')';
    ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+len,wy+activeWindGust.forceY*3);ctx.stroke();
  }

  // Big central wind label
  let alpha2=Math.sin(windArrowTimer*0.12)*0.2+0.8;
  ctx.globalAlpha=alpha2;
  let wl=activeWindGust.forceX>1.5?'💨💨 STRONG TAILWIND!':
    activeWindGust.forceX>0.3?'💨 Tailwind':
    activeWindGust.forceX<-1.5?'🌧️🌧️ STRONG HEADWIND!':
    activeWindGust.forceX<-0.3?'🌧️ Headwind':
    activeWindGust.forceY<-1?'⬆️ UPDRAFT!':'💨 Gust';
  ctx.fillStyle=isGood?'#98FB98':'#FF6B6B';
  ctx.font='bold 20px "Bubblegum Sans",cursive';ctx.textAlign='center';
  // Background for readability
  let twid=ctx.measureText(wl).width;
  roundRect(450-twid/2-12,555,twid+24,30,8,isGood?'rgba(0,80,0,0.7)':'rgba(100,0,0,0.7)',null);
  ctx.fillStyle=isGood?'#98FB98':'#FF6B6B';
  ctx.fillText(wl,450,577);
  ctx.textAlign='left';ctx.globalAlpha=1;
}

// ═══ CHARACTER DRAWING ═══
function drawGranny(x,y,throwing){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,5,25,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COLORS.dress;ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-18,-30);ctx.quadraticCurveTo(-22,0,-20,5);
  ctx.lineTo(20,5);ctx.quadraticCurveTo(22,0,18,-30);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#E1BEE7';

function generateLuck(){
  let roll=Math.random();
  if(roll<0.08){luckMultiplier=0.2+Math.random()*0.2;luckLabel='🌧️ GALE FORCE HEADWIND!';luckIcon='🌧️';
  }else if(roll<0.20){luckMultiplier=0.45+Math.random()*0.25;luckLabel='💨 Headwind slows the snail...';luckIcon='💨';
  }else if(roll<0.55){luckMultiplier=0.7+Math.random()*0.35;luckLabel='';luckIcon='';
  }else if(roll<0.75){luckMultiplier=1.05+Math.random()*0.35;luckLabel='🍀 Tailwind! Catching a breeze!';luckIcon='🍀';
  }else if(roll<0.90){luckMultiplier=1.4+Math.random()*0.5;luckLabel='🌪️ MEGA GUST! Snail is soaring!';luckIcon='🌪️';
  }else{luckMultiplier=1.9+Math.random()*0.8;luckLabel='⚡ LEGENDARY THERMAL!!';luckIcon='⚡';}

  // Add superboost multiplier on top
  if(superBoostActive) luckMultiplier *= 1.4;

  windEvents=[];
  let n=2+Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    windEvents.push({triggerFrame:20+Math.floor(Math.random()*300),
      duration:25+Math.floor(Math.random()*80),
      forceX:(Math.random()-0.35)*5,forceY:(Math.random()-0.55)*4,elapsed:0});
  }
}

function wrapText(text,cx,startY,maxW,lh){
  let words=text.split(' '),line='',y=startY;ctx.textAlign='center';
  for(let i=0;i<words.length;i++){let test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){ctx.fillText(line.trim(),cx,y);line=words[i]+' ';y+=lh;}
    else{line=test;}}
  ctx.fillText(line.trim(),cx,y);ctx.textAlign='left';
}

// ═══ GAME LOGIC ═══
function throwSnail(){
  state=STATE.FLYING;flyFrameCount=0;passedLandmarks.clear();
  generateLuck();
  SFX.throw();
  if(luckMultiplier>1.5) setTimeout(()=>SFX.tailwind(),300);
  else if(luckMultiplier<0.5) setTimeout(()=>SFX.headwind(),300);

  let throwPower=power/maxPower;
  // Harder to reach Winchester: lower base speed
  let baseSpeed=throwPower*18+1.5;
  let speedFactor=baseSpeed*luckMultiplier;

  snailX=150;snailY=GROUND_Y-80;
  snailVX=speedFactor;snailVY=-speedFactor*0.6;snailRotation=0;
}

function update(){
  frameCount++;
  if(state===STATE.CHARGING){
    if(throwStarted){chargeTimer++;power=Math.max(0,power-0.15);
      if(chargeTimer>=chargeTimeLimit)throwSnail();}
  }
  if(state===STATE.FLYING){
    flyFrameCount++;
    activeWindGust=null;
    windEvents.forEach(we=>{
      if(flyFrameCount>=we.triggerFrame&&we.elapsed<we.duration){
        snailVX+=we.forceX*0.07;snailVY+=we.forceY*0.05;
        we.elapsed++;activeWindGust=we;
        if(we.elapsed===1) SFX.windGust();
      }
    });
    snailVY+=0.19;snailX+=snailVX;snailY+=snailVY;
    snailVX*=0.9982; // slightly more drag

    // Check if passed a landmark
    let miles=Math.max(0,(snailX-120)/MILE_TO_PX);
    landmarks.forEach(lm=>{
      if(lm.dist>0&&miles>=lm.dist&&!passedLandmarks.has(lm.dist)){
        passedLandmarks.add(lm.dist);SFX.passLandmark();}
    });

    let targetCam=snailX-300;
    cameraX+=(targetCam-cameraX)*0.08;if(cameraX<0)cameraX=0;
    if(frameCount%2===0)addTrail();
    if(snailY>=GROUND_Y-15&&snailVY>0){
      if(landingBounces<2&&snailVX>3){
        snailY=GROUND_Y-15;snailVY=-snailVY*0.3;snailVX*=0.6;
        landingBounces++;addLanding();SFX.bounce();
      }else{
        snailY=GROUND_Y-15;snailVX=0;snailVY=0;
        distanceMiles=Math.max(0,(snailX-120)/MILE_TO_PX);
        if(distanceMiles>162)distanceMiles=162;
        if(distanceMiles>bestDistance){bestDistance=distanceMiles;saveBest();}
        addLanding();SFX.land();
        if(distanceMiles>=160)setTimeout(()=>SFX.victoryBig(),400);
        else if(distanceMiles>=80)setTimeout(()=>SFX.victoryShort(),400);
        state=STATE.RESULT;
      }
    }
    if(snailY>700){
      snailY=GROUND_Y-15;distanceMiles=Math.max(0,(snailX-120)/MILE_TO_PX);
      if(distanceMiles>162)distanceMiles=162;
      if(distanceMiles>bestDistance){bestDistance=distanceMiles;saveBest();}
      SFX.land();state=STATE.RESULT;
    }
  }
  updateParticles();
}

function draw(){
  ctx.clearRect(0,0,900,600);ctx.save();
  if(state===STATE.TITLE)drawTitleScreen();
  else if(state===STATE.CHARGING)drawChargingScreen();
  else if(state===STATE.FLYING)drawFlyingScreen();
  else if(state===STATE.RESULT)drawResultScreen();
  ctx.restore();
  if(canvas.style.opacity==='0'||canvas.style.opacity==='')canvas.style.opacity='1';
}

function resetGame(){
  state=STATE.CHARGING;power=0;lastKey=null;keyCount=0;
  chargeTimer=0;throwStarted=false;
  snailX=150;snailY=GROUND_Y-80;snailVX=0;snailVY=0;
  cameraX=0;distanceMiles=0;landingBounces=0;snailRotation=0;
  trailParticles=[];luckMultiplier=1;luckLabel='';luckIcon='';
  windEvents=[];activeWindGust=null;windArrowTimer=0;flyFrameCount=0;
  passedLandmarks.clear();
  slowPressCount=0;superBoostActive=false;superBoostFlash=0;
  rhythmGaps=[];lastKeyTime=0;windMeterValue=0;windMeterTarget=0;
}

// ═══ INPUT ═══
document.addEventListener('keydown',(e)=>{
  resumeAudio();
  if(state===STATE.TITLE&&e.code==='Space'){e.preventDefault();SFX.start();resetGame();return;}
  if(state===STATE.RESULT&&e.code==='Space'){e.preventDefault();SFX.start();resetGame();return;}
  if(state===STATE.CHARGING){
    e.preventDefault();
    let now=performance.now();
    let validPress=false;
    if(e.code==='ArrowLeft'&&lastKey!=='left'){lastKey='left';validPress=true;}
    else if(e.code==='ArrowRight'&&lastKey!=='right'){lastKey='right';validPress=true;}
    if(validPress){
      keyCount++;throwStarted=true;

      // Superboost: track rhythm of key presses
      if(lastKeyTime>0){
        let gap=now-lastKeyTime;
        rhythmGaps.push(gap);
        // "Slow" press = 280-600ms gap (deliberate rhythm, not mashing)
        if(gap>=280&&gap<=600){
          slowPressCount++;
          if(slowPressCount>=5&&!superBoostActive){
            superBoostActive=true;SFX.superBoost();superBoostFlash=60;
          }
        }else{
          // Reset if they break rhythm (too fast or too slow)
          if(gap<200||gap>800){slowPressCount=Math.max(0,slowPressCount-2);}
        }
      }
      lastKeyTime=now;

      // Power per press: base + slight acceleration
      let pressBonus=superBoostActive?5.5:3.2;
      power=Math.min(maxPower,power+pressBonus+(keyCount*0.04));
      SFX.keyPress(keyCount);
    }
  }
});

function gameLoop(){update();draw();drawTouchControls();requestAnimationFrame(gameLoop);}

// ═══ TOUCH CONTROLS ═══
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let touchLeftActive = false;
let touchRightActive = false;

// Convert touch/click position to canvas coordinates
function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (GAME_W / rect.width),
    y: (clientY - rect.top) * (GAME_H / rect.height)
  };
}

// Touch button regions (drawn at bottom of canvas)
const TB = {
  // Left button: bottom-left area
  left:  { x: 40,  y: 500, w: 180, h: 80 },
  // Right button: bottom-right area
  right: { x: 680, y: 500, w: 180, h: 80 },
  // Center button (start/retry): bottom-center
  center: { x: 300, y: 500, w: 300, h: 80 },
};

function hitTest(pos, btn) {
  return pos.x >= btn.x && pos.x <= btn.x + btn.w &&
         pos.y >= btn.y && pos.y <= btn.y + btn.h;
}

function drawTouchButton(btn, label, color, active) {
  ctx.save();
  ctx.globalAlpha = active ? 0.85 : 0.5;
  roundRect(btn.x, btn.y, btn.w, btn.h, 16, color, '#FFF', 2);
  ctx.globalAlpha = active ? 1 : 0.7;
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 28px "Bubblegum Sans",cursive';
  ctx.textAlign = 'center';
  ctx.fillText(label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 10);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawTouchControls() {
  if (!isTouchDevice) return;

  if (state === STATE.TITLE) {
    drawTouchButton(TB.center, '▶  TAP TO START', '#FF3333', false);
  } else if (state === STATE.CHARGING) {
    drawTouchButton(TB.left, '◀  LEFT', '#336699', touchLeftActive);
    drawTouchButton(TB.right, 'RIGHT  ▶', '#336699', touchRightActive);
    // Rhythm hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px "Bubblegum Sans",cursive';
    ctx.textAlign = 'center';
    ctx.fillText('Alternate taps! Slow & steady for bonus', 450, 595);
    ctx.textAlign = 'left';
    ctx.restore();
  } else if (state === STATE.RESULT) {
    drawTouchButton(TB.center, '🔄  TAP TO RETRY', '#FF3333', false);
  }
  // No buttons during flight — just watch the snail fly
}

function handleTouchCharge(side) {
  resumeAudio();
  let now = performance.now();
  let validPress = false;
  if (side === 'left' && lastKey !== 'left') { lastKey = 'left'; validPress = true; }
  else if (side === 'right' && lastKey !== 'right') { lastKey = 'right'; validPress = true; }
  if (validPress) {
    keyCount++; throwStarted = true;
    if (lastKeyTime > 0) {
      let gap = now - lastKeyTime;
      rhythmGaps.push(gap);
      if (gap >= 280 && gap <= 600) {
        slowPressCount++;
        if (slowPressCount >= 5 && !superBoostActive) {
          superBoostActive = true; SFX.superBoost(); superBoostFlash = 60;
        }
      } else {
        if (gap < 200 || gap > 800) { slowPressCount = Math.max(0, slowPressCount - 2); }
      }
    }
    lastKeyTime = now;
    let pressBonus = superBoostActive ? 5.5 : 3.2;
    power = Math.min(maxPower, power + pressBonus + (keyCount * 0.04));
    SFX.keyPress(keyCount);
  }
}

// Touch event listeners
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  resumeAudio();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const pos = getCanvasPos(t.clientX, t.clientY);

    if (state === STATE.TITLE) {
      if (hitTest(pos, TB.center)) { SFX.start(); resetGame(); }
    } else if (state === STATE.RESULT) {
      if (hitTest(pos, TB.center)) { SFX.start(); resetGame(); }
    } else if (state === STATE.CHARGING) {
      if (hitTest(pos, TB.left)) { touchLeftActive = true; handleTouchCharge('left'); }
      else if (hitTest(pos, TB.right)) { touchRightActive = true; handleTouchCharge('right'); }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  touchLeftActive = false;
  touchRightActive = false;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
}, { passive: false });

gameLoop();
</script>
